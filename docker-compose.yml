services:
  transcriber:
    build: .
    image: arabic-transcriber
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      ASR_MODEL: /model
      DATA_DIR: /data
      HF_HUB_OFFLINE: "1"
    volumes:
      # Plain model folder on the host (download once with:
      #   hf download mistralai/Voxtral-Mini-4B-Realtime-Arabic --exclude consolidated.safetensors --local-dir <folder>)
      - ${MODEL_DIR:-D:/AI/models/voxtral-arabic}:/model:ro
      # Transcripts + audio library (shared with the non-Docker app)
      - ${DATA_DIR:-D:/AI/arabic-transcriber-data}:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
